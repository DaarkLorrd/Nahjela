<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Girlfriend's Day — For Nahjela</title>
<meta name="description" content="A love letter for Nahjela.">

<!-- Google Fonts: a characterful display serif for the emotional beats, a quiet sans for everything else -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     DESIGN TOKENS
     Palette: midnight aubergine → rose glow, one gold accent used
     sparingly for the "precious" moments (the button, the finale).
  ============================================================ */
  :root{
    --ink-deep:      #0a0715;
    --ink-mid:       #170f2b;
    --plum:          #2c1a45;
    --rose:          #ff6f9c;
    --rose-soft:     #ffb3c9;
    --lavender:      #b79bea;
    --gold:          #f2c675;
    --paper:         #fbf3e9;
    --paper-dim:     rgba(251,243,233,0.72);

    --display: 'Cormorant Garamond', Georgia, serif;
    --body:    'Jost', 'Helvetica Neue', Arial, sans-serif;

    --ease-out: cubic-bezier(.16,.8,.28,1);
    --ease-soft: cubic-bezier(.4,0,.2,1);
  }

  /* ============================================================
     RESET
  ============================================================ */
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    overflow-x:hidden;
    background:var(--ink-deep);
    color:var(--paper);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
  }
  html{ scroll-behavior:smooth; }
  body{ position:relative; min-height:100svh; }
  img,video{ max-width:100%; display:block; }
  button{ font-family:inherit; cursor:pointer; }
  a{ color:inherit; }

  /* Respect reduced motion globally — heavy overrides live near each animation too */
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
  }

  /* Visible keyboard focus, never trapped, never removed */
  :focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
    border-radius:4px;
  }

  /* ============================================================
     AMBIENT BACKGROUND — stars / drifting gradient / canvas particles
     Sits fixed behind everything, everywhere on the page.
  ============================================================ */
  #ambient{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 15%, rgba(183,155,234,0.20), transparent 60%),
      radial-gradient(ellipse 70% 50% at 85% 80%, rgba(255,111,156,0.18), transparent 60%),
      linear-gradient(180deg, var(--ink-deep) 0%, var(--ink-mid) 45%, var(--plum) 100%);
    background-size:200% 200%;
    animation:driftGradient 22s ease-in-out infinite;
  }
  @keyframes driftGradient{
    0%,100%{ background-position:0% 0%; }
    50%{ background-position:60% 40%; }
  }
  #stars, #particles{
    position:fixed; inset:0; z-index:1;
    width:100%; height:100%;
    pointer-events:none;
  }

  /* ============================================================
     VIDEO INTRO
  ============================================================ */
  #intro{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:#000;
    transition:opacity 1.4s var(--ease-soft), visibility 1.4s;
  }
  #intro.hidden{
    opacity:0; visibility:hidden; pointer-events:none;
  }
  #intro-video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
  }
  #intro-scrim{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.55) 100%);
  }
  #intro-fallback{
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center;
  }
  #intro-fallback.active{ display:flex; }

  #play-btn{
    position:relative; z-index:2;
    width:88px; height:88px;
    border-radius:50%;
    border:1.5px solid rgba(251,243,233,0.55);
    background:rgba(251,243,233,0.08);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    display:none;
    align-items:center; justify-content:center;
    box-shadow:0 0 40px rgba(255,111,156,0.35);
    animation:pulseGlow 2.6s ease-in-out infinite;
    transition:transform .3s var(--ease-out), background .3s;
  }
  #play-btn.visible{ display:flex; }
  #play-btn:hover{ transform:scale(1.08); background:rgba(251,243,233,0.15); }
  #play-btn svg{ width:30px; height:30px; margin-left:5px; fill:var(--paper); }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 0 30px rgba(255,111,156,0.30); }
    50%{ box-shadow:0 0 55px rgba(255,111,156,0.55); }
  }

  #intro-caption{
    position:absolute; bottom:9%; left:0; right:0;
    text-align:center; z-index:2;
    font-family:var(--display);
    font-size:clamp(1.1rem, 3vw, 1.6rem);
    font-style:italic;
    color:var(--paper-dim);
    letter-spacing:.02em;
    opacity:0;
    animation:fadeUpIn 1.6s var(--ease-out) 0.6s forwards;
  }
  @keyframes fadeUpIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  #skip-intro{
    position:absolute; top:24px; right:24px; z-index:3;
    background:transparent; border:1px solid rgba(251,243,233,0.35);
    color:var(--paper-dim); font-size:.8rem; letter-spacing:.08em;
    text-transform:uppercase; padding:9px 16px; border-radius:999px;
    transition:border-color .3s, color .3s;
  }
  #skip-intro:hover{ border-color:var(--paper); color:var(--paper); }

  /* ============================================================
     MAIN EXPERIENCE
  ============================================================ */
  #experience{
    position:relative; z-index:2;
    opacity:0;
    transition:opacity 1.6s var(--ease-soft);
  }
  #experience.revealed{ opacity:1; }

  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:0 24px;
  }

  /* ---- Letter section ---- */
  #letter-section{
    min-height:100svh;
    display:flex; align-items:center; justify-content:center;
    padding:min(12vh,110px) 0 90px;
  }

  .glass-card{
    position:relative;
    width:100%;
    padding:clamp(28px, 6vw, 64px);
    border-radius:28px;
    background:rgba(251,243,233,0.055);
    border:1px solid rgba(251,243,233,0.14);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 30px 90px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    opacity:0;
    transform:translateY(30px) scale(.98);
  }
  .glass-card.in-view{
    animation:cardRise 1.2s var(--ease-out) forwards;
  }
  @keyframes cardRise{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .eyebrow{
    font-family:var(--body);
    font-size:.72rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--rose-soft);
    text-align:center;
    margin-bottom:18px;
    opacity:.85;
  }

  h1.title{
    font-family:var(--display);
    font-weight:600;
    font-size:clamp(2.1rem, 6vw, 3.4rem);
    text-align:center;
    line-height:1.1;
    background:linear-gradient(100deg, var(--paper) 20%, var(--rose-soft) 55%, var(--lavender) 85%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:0 0 6px;
  }

  h2.subtitle{
    font-family:var(--display);
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.15rem, 3vw, 1.5rem);
    text-align:center;
    color:var(--paper-dim);
    margin:0 0 44px;
  }

  .divider{
    width:56px; height:1px;
    margin:0 auto 44px;
    background:linear-gradient(90deg, transparent, var(--rose), transparent);
  }

  #letter-text{
    font-family:var(--display);
    font-size:clamp(1.12rem, 2.6vw, 1.35rem);
    line-height:1.85;
    color:var(--paper);
    white-space:pre-wrap;
    min-height:340px;
  }
  #letter-text .cursor{
    display:inline-block;
    width:2px; height:1.1em;
    background:var(--rose-soft);
    margin-left:2px;
    vertical-align:text-bottom;
    animation:blink 1s step-end infinite;
  }
  #letter-text .cursor.done{ display:none; }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ---- Surprise button ---- */
  #surprise-wrap{
    display:flex; justify-content:center;
    margin-top:52px;
    opacity:0; transform:translateY(16px);
    transition:opacity 1s var(--ease-out), transform 1s var(--ease-out);
    pointer-events:none;
  }
  #surprise-wrap.ready{ opacity:1; transform:translateY(0); pointer-events:auto; }

  #surprise-btn{
    position:relative;
    padding:18px 40px;
    font-family:var(--body);
    font-size:1rem;
    letter-spacing:.04em;
    color:var(--ink-deep);
    background:linear-gradient(120deg, var(--gold), var(--rose-soft));
    border:none;
    border-radius:999px;
    font-weight:500;
    box-shadow:0 12px 40px rgba(255,111,156,0.35);
    transition:transform .35s var(--ease-out), box-shadow .35s var(--ease-out);
  }
  #surprise-btn:hover{
    transform:translateY(-3px) scale(1.03);
    box-shadow:0 18px 55px rgba(255,111,156,0.5);
  }
  #surprise-btn:active{ transform:translateY(-1px) scale(0.99); }

  /* ============================================================
     FINALE
  ============================================================ */
  #finale{
    position:fixed; inset:0; z-index:80;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, var(--plum) 0%, var(--ink-deep) 75%);
    opacity:0; visibility:hidden;
    transition:opacity 1.8s var(--ease-soft), visibility 1.8s;
  }
  #finale.active{ opacity:1; visibility:visible; }

  #finale-hearts{
    position:absolute; inset:0; overflow:hidden; pointer-events:none;
  }
  .burst-heart{
    position:absolute;
    bottom:-5%;
    font-size:1.4rem;
    opacity:0;
    animation:burstUp linear forwards;
    filter:drop-shadow(0 0 6px rgba(255,111,156,0.65));
  }
  @keyframes burstUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:1; }
    100%{ transform:translateY(-115vh) translateX(var(--drift,0px)) rotate(var(--spin,180deg)); opacity:0; }
  }

  #finale-content{
    position:relative; z-index:2; text-align:center; padding:0 24px;
    opacity:0; transform:scale(.92);
    transition:opacity 1.4s var(--ease-out) .5s, transform 1.4s var(--ease-out) .5s;
  }
  #finale.active #finale-content{ opacity:1; transform:scale(1); }

  #finale-content .heart-glow{
    font-size:clamp(2.4rem, 8vw, 3.6rem);
    display:block;
    margin-bottom:18px;
    animation:heartbeat 1.8s ease-in-out infinite;
    filter:drop-shadow(0 0 20px rgba(255,111,156,0.7));
  }
  @keyframes heartbeat{
    0%,100%{ transform:scale(1); }
    15%{ transform:scale(1.15); }
    30%{ transform:scale(1); }
    45%{ transform:scale(1.1); }
  }

  #finale-content h2{
    font-family:var(--display);
    font-weight:600;
    font-size:clamp(2rem, 7vw, 3.4rem);
    background:linear-gradient(100deg, var(--paper), var(--rose-soft), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:0 0 22px;
  }
  #finale-content p{
    font-family:var(--display);
    font-style:italic;
    font-size:clamp(1.1rem, 3vw, 1.5rem);
    color:var(--paper-dim);
    line-height:1.6;
    margin:0;
  }

  /* ============================================================
     MUSIC PLAYER
  ============================================================ */
  #music-player{
    position:fixed; bottom:22px; right:22px; z-index:90;
    display:none;
    align-items:center; gap:10px;
    padding:10px 16px 10px 12px;
    border-radius:999px;
    background:rgba(23,15,43,0.55);
    border:1px solid rgba(251,243,233,0.18);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  #music-player.enabled{ display:flex; }
  #music-toggle{
    width:34px; height:34px;
    border-radius:50%;
    border:none;
    background:linear-gradient(120deg, var(--rose), var(--lavender));
    display:flex; align-items:center; justify-content:center;
  }
  #music-toggle svg{ width:14px; height:14px; fill:var(--ink-deep); }
  #music-player span{
    font-size:.72rem; letter-spacing:.06em;
    color:var(--paper-dim); text-transform:uppercase;
    padding-right:2px;
  }

  /* ============================================================
     FOOTNOTE
  ============================================================ */
  #footnote{
    text-align:center;
    font-size:.72rem;
    letter-spacing:.06em;
    color:rgba(251,243,233,0.35);
    padding:40px 0 60px;
  }

  /* ============================================================
     RESPONSIVE
  ============================================================ */
  @media (max-width:480px){
    .glass-card{ border-radius:20px; padding:26px 20px 34px; }
    #letter-text{ min-height:420px; }
    #surprise-btn{ padding:16px 30px; font-size:.92rem; }
  }
</style>
</head>
<body>

  <!-- ============================================================
       AMBIENT BACKGROUND (persistent: gradient + stars + particles)
  ============================================================ -->
  <div id="ambient" aria-hidden="true"></div>
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="particles" aria-hidden="true"></canvas>

  <!-- ============================================================
       VIDEO INTRO
  ============================================================ -->
  <section id="intro" aria-label="Video introduction">
    <video id="intro-video" playsinline muted autoplay preload="auto"></video>
    <div id="intro-scrim"></div>

    <div id="intro-fallback" aria-hidden="true"></div>

    <button id="play-btn" aria-label="Play video">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>

    <p id="intro-caption">For my beautiful Nahjela</p>
    <button id="skip-intro" aria-label="Skip introduction">Skip</button>
  </section>

  <!-- ============================================================
       MAIN EXPERIENCE
  ============================================================ -->
  <main id="experience">

    <section id="letter-section" class="wrap">
      <article class="glass-card" id="letter-card">
        <p class="eyebrow">Girlfriend's Day</p>
        <h1 class="title">Happy Girlfriend's Day ❤️</h1>
        <h2 class="subtitle">To My Beautiful Nahjela</h2>
        <div class="divider"></div>

        <p id="letter-text"><span class="cursor"></span></p>

        <div id="surprise-wrap">
          <button id="surprise-btn">💖 One Last Surprise</button>
        </div>
      </article>
    </section>

    <p id="footnote">Made with love, for Nahjela.</p>
  </main>

  <!-- ============================================================
       FINALE
  ============================================================ -->
  <section id="finale" aria-live="polite" aria-label="Final message">
    <div id="finale-hearts" aria-hidden="true"></div>
    <div id="finale-content">
      <span class="heart-glow" aria-hidden="true">❤️</span>
      <h2>I Love You, Nahjela ❤️</h2>
      <p>Forever Yours,<br>Simon</p>
    </div>
  </section>

  <!-- ============================================================
       MUSIC PLAYER
  ============================================================ -->
  <div id="music-player">
    <button id="music-toggle" aria-label="Play background music">
      <svg id="music-icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <span>Music</span>
  </div>

  <script>
  /* ================================================================
     CONFIG — edit these two lines only.
     VIDEO_URL should be a direct, playable video file (.mp4/.webm)
     from a real host (Cloudinary, S3, Vercel Blob, etc). Google
     Drive "share" links are NOT direct video files, so the intro
     auto-detects that case and falls back gracefully to the
     animated background instead of breaking the page.
  ================================================================ */
  const VIDEO_URL = "https://drive.google.com/file/d/1w0jbZQfBwrGe1-LIiaUF-9JjWRiIRx-k/preview"; // PASTE_VIDEO_URL_HERE
  const MUSIC_URL = ""; // PASTE_MUSIC_URL_HERE (leave empty to hide the player)

  /* Respect the user's motion preference throughout */
  const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================================================================
     MODULE: Video Intro
     Handles autoplay, manual play fallback, timeout-safe skipping,
     and a graceful fade into the main experience. The page can
     never get stuck here — every path leads to reveal().
  ================================================================ */
  const IntroModule = (() => {
    const intro      = document.getElementById('intro');
    const video      = document.getElementById('intro-video');
    const playBtn     = document.getElementById('play-btn');
    const skipBtn     = document.getElementById('skip-intro');
    const fallback     = document.getElementById('intro-fallback');
    let revealed = false;

    function reveal(){
      if (revealed) return;
      revealed = true;
      intro.classList.add('hidden');
      document.getElementById('experience').classList.add('revealed');
      // Give focus to the letter for keyboard/screen-reader users
      window.setTimeout(() => {
        document.getElementById('letter-card').setAttribute('tabindex','-1');
        LetterModule.start();
      }, 400);
    }

    function isDirectVideoFile(url){
      return /\.(mp4|webm|ogg)(\?.*)?$/i.test(url);
    }

    function useFallbackBackground(){
      fallback.classList.add('active');
      video.style.display = 'none';
      // The ambient particle background is already running underneath,
      // so the fallback simply skips straight into the experience.
      window.setTimeout(reveal, 2000);
    }

    function init(){
      skipBtn.addEventListener('click', reveal);

      if (!VIDEO_URL || !isDirectVideoFile(VIDEO_URL)){
        // Not a direct playable file (e.g. a Drive share link) —
        // skip straight to a beautiful fallback instead of breaking.
        useFallbackBackground();
        return;
      }

      video.src = VIDEO_URL;

      // Safety net: if nothing has happened within a few seconds,
      // never leave the visitor stuck on a black screen.
      const stuckTimer = window.setTimeout(useFallbackBackground, 6000);

      video.addEventListener('canplay', () => window.clearTimeout(stuckTimer));

      video.addEventListener('error', () => {
        window.clearTimeout(stuckTimer);
        useFallbackBackground();
      });

      video.addEventListener('ended', reveal);

      // Try autoplay (muted, which browsers allow); if it's blocked,
      // show a beautiful play button instead of failing silently.
      const playAttempt = video.play();
      if (playAttempt !== undefined){
        playAttempt.catch(() => {
          playBtn.classList.add('visible');
        });
      }

      playBtn.addEventListener('click', () => {
        video.muted = false;
        video.play().then(() => playBtn.classList.remove('visible'));
      });
    }

    return { init };
  })();

  /* ================================================================
     MODULE: Ambient Background (stars + drifting particles)
     Two lightweight canvases: still stars, and slow drifting
     hearts / sparkles. Density scales down under reduced-motion.
  ================================================================ */
  const AmbientModule = (() => {
    const starCanvas = document.getElementById('stars');
    const partCanvas = document.getElementById('particles');
    const sctx = starCanvas.getContext('2d');
    const pctx = partCanvas.getContext('2d');
    let stars = [];
    let particles = [];
    let raf = null;

    function resize(){
      [starCanvas, partCanvas].forEach(c => {
        c.width = window.innerWidth;
        c.height = window.innerHeight;
      });
    }

    function buildStars(){
      const count = REDUCED_MOTION ? 40 : 110;
      stars = Array.from({length: count}, () => ({
        x: Math.random() * starCanvas.width,
        y: Math.random() * starCanvas.height,
        r: Math.random() * 1.3 + 0.2,
        phase: Math.random() * Math.PI * 2,
        speed: 0.01 + Math.random() * 0.02
      }));
    }

    function buildParticles(){
      const count = REDUCED_MOTION ? 10 : 26;
      const glyphs = ['heart','spark'];
      particles = Array.from({length: count}, () => ({
        x: Math.random() * partCanvas.width,
        y: Math.random() * partCanvas.height,
        size: 6 + Math.random() * 10,
        speedY: 0.15 + Math.random() * 0.35,
        driftX: (Math.random() - 0.5) * 0.4,
        glyph: glyphs[Math.random() > 0.7 ? 0 : 1],
        opacity: 0.15 + Math.random() * 0.35
      }));
    }

    function drawHeart(ctx, x, y, size, opacity){
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.translate(x, y);
      ctx.fillStyle = '#ff6f9c';
      ctx.shadowColor = '#ff6f9c';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      const s = size / 16;
      ctx.moveTo(0, 4*s);
      ctx.bezierCurveTo(0, 2*s, -4*s, -4*s, -8*s, -2*s);
      ctx.bezierCurveTo(-14*s, 2*s, -6*s, 10*s, 0, 14*s);
      ctx.bezierCurveTo(6*s, 10*s, 14*s, 2*s, 8*s, -2*s);
      ctx.bezierCurveTo(4*s, -4*s, 0, 2*s, 0, 4*s);
      ctx.fill();
      ctx.restore();
    }

    function drawSpark(ctx, x, y, size, opacity){
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.fillStyle = '#f2c675';
      ctx.shadowColor = '#f2c675';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(x, y, size/6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function tick(t){
      sctx.clearRect(0,0,starCanvas.width, starCanvas.height);
      stars.forEach(s => {
        const tw = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
        sctx.save();
        sctx.globalAlpha = 0.25 + tw * 0.6;
        sctx.fillStyle = '#fbf3e9';
        sctx.beginPath();
        sctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        sctx.fill();
        sctx.restore();
      });

      pctx.clearRect(0,0,partCanvas.width, partCanvas.height);
      particles.forEach(p => {
        if (!REDUCED_MOTION){
          p.y -= p.speedY;
          p.x += p.driftX;
          if (p.y < -20){ p.y = partCanvas.height + 20; p.x = Math.random() * partCanvas.width; }
        }
        if (p.glyph === 'heart') drawHeart(pctx, p.x, p.y, p.size, p.opacity);
        else drawSpark(pctx, p.x, p.y, p.size, p.opacity);
      });

      raf = requestAnimationFrame(tick);
    }

    function init(){
      resize();
      buildStars();
      buildParticles();
      window.addEventListener('resize', () => {
        resize(); buildStars(); buildParticles();
      });
      raf = requestAnimationFrame(tick);
    }

    return { init };
  })();

  /* ================================================================
     MODULE: Love Letter (typewriter + scroll reveal)
  ================================================================ */
  const LetterModule = (() => {
    const textEl = document.getElementById('letter-text');
    const card   = document.getElementById('letter-card');
    const surpriseWrap = document.getElementById('surprise-wrap');

    const LETTER = `Nahjela,

There's a version of me from before you that I can barely recognize — restless, moving fast, chasing everything but rarely still. You didn't slow me down. You gave me a reason to actually look up.

I love how easily you laugh at things only we find funny. I love that you believe in the things I build before I've finished explaining them. I love the quiet moments too — waiting for your reply, hearing your voice at the end of a long day, the way ordinary time turns into something worth remembering simply because you're in it.

Today isn't really about a date on a calendar. It's about a decision I keep making, over and over, without ever thinking twice: you. Every version of my future I imagine has you standing somewhere in it.

So happy Girlfriend's Day, Nahjela. Thank you for choosing me, for staying, for being exactly who you are.

This is just the beginning.`;

    let started = false;

    function typewrite(){
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      let i = 0;

      if (REDUCED_MOTION){
        textEl.textContent = LETTER;
        showSurprise();
        return;
      }

      function step(){
        if (i <= LETTER.length){
          textEl.textContent = LETTER.slice(0, i);
          textEl.appendChild(cursor);
          i++;
          // Slightly irregular pacing reads more human than a fixed interval
          const delay = 14 + Math.random() * 22;
          window.setTimeout(step, delay);
        } else {
          cursor.classList.add('done');
          showSurprise();
        }
      }
      step();
    }

    function showSurprise(){
      surpriseWrap.classList.add('ready');
    }

    function start(){
      if (started) return;
      started = true;
      card.classList.add('in-view');
      window.setTimeout(typewrite, 500);
    }

    return { start };
  })();

  /* ================================================================
     MODULE: Finale — cinematic heart burst + final reveal
  ================================================================ */
  const FinaleModule = (() => {
    const finale = document.getElementById('finale');
    const heartsLayer = document.getElementById('finale-hearts');
    const btn = document.getElementById('surprise-btn');
    const glyphs = ['❤️','💖','💕','💗','✨'];

    function spawnHearts(){
      const count = REDUCED_MOTION ? 30 : 220;
      const frag = document.createDocumentFragment();
      for (let i = 0; i < count; i++){
        const h = document.createElement('span');
        h.className = 'burst-heart';
        h.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
        const left = Math.random() * 100;
        const size = 0.9 + Math.random() * 1.8;
        const duration = 4 + Math.random() * 5;
        const delay = Math.random() * 3;
        h.style.left = left + 'vw';
        h.style.fontSize = size + 'rem';
        h.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
        h.style.setProperty('--spin', (Math.random() * 360 - 180) + 'deg');
        h.style.animationDuration = duration + 's';
        h.style.animationDelay = delay + 's';
        frag.appendChild(h);
      }
      heartsLayer.appendChild(frag);
    }

    function init(){
      btn.addEventListener('click', () => {
        finale.classList.add('active');
        spawnHearts();
        // Move focus into the finale for keyboard/screen-reader users;
        // nothing here traps focus, Tab/Shift+Tab remain fully free.
        finale.setAttribute('tabindex', '-1');
        finale.focus({ preventScroll: true });
      });
    }

    return { init };
  })();

  /* ================================================================
     MODULE: Music Player (only appears if MUSIC_URL is supplied)
  ================================================================ */
  const MusicModule = (() => {
    const player = document.getElementById('music-player');
    const toggle = document.getElementById('music-toggle');
    const icon = document.getElementById('music-icon-play');
    let audio = null;
    let playing = false;

    const ICON_PLAY  = '<path d="M8 5v14l11-7z"/>';
    const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

    function init(){
      if (!MUSIC_URL) return; // stays hidden entirely
      audio = new Audio(MUSIC_URL);
      audio.loop = true;
      audio.volume = 0.55;
      player.classList.add('enabled');

      toggle.addEventListener('click', () => {
        if (playing){
          audio.pause();
          icon.outerHTML = `<svg id="music-icon-play" viewBox="0 0 24 24">${ICON_PLAY}</svg>`;
        } else {
          audio.play().catch(() => {});
          icon.outerHTML = `<svg id="music-icon-play" viewBox="0 0 24 24">${ICON_PAUSE}</svg>`;
        }
        playing = !playing;
      });
    }

    return { init };
  })();

  /* ================================================================
     BOOT
  ================================================================ */
  document.addEventListener('DOMContentLoaded', () => {
    AmbientModule.init();
    IntroModule.init();
    FinaleModule.init();
    MusicModule.init();
  });
  </script>
</body>
</html>
