<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Girlfriend's Day — For Nahjela</title>
<meta name="description" content="A love letter for Nahjela.">

<!-- Display serif for the emotional beats, a quiet sans for everything else -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     DESIGN TOKENS
     Palette: midnight aubergine → rose glow, with one gold accent
     reserved for the "precious" moments (the button, the finale).
  ============================================================ */
  :root{
    --ink-deep:      #0a0715;
    --ink-mid:       #170f2b;
    --plum:          #2c1a45;
    --rose:          #ff6f9c;
    --rose-soft:     #ffb3c9;
    --lavender:      #b79bea;
    --gold:          #f2c675;
    --paper:         #fbf3e9;
    --paper-dim:     rgba(251,243,233,0.72);

    --display: 'Cormorant Garamond', Georgia, serif;
    --body:    'Jost', 'Helvetica Neue', Arial, sans-serif;

    --ease-out: cubic-bezier(.16,.8,.28,1);
    --ease-soft: cubic-bezier(.4,0,.2,1);
  }

  /* ============================================================
     RESET
  ============================================================ */
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    width:100%; min-height:100%;
    overflow-x:hidden;
    background:var(--ink-deep);
    color:var(--paper);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
  }
  html{ scroll-behavior:smooth; }
  img,video{ max-width:100%; display:block; }
  button{ font-family:inherit; cursor:pointer; }

  /* Respect reduced motion globally; individual modules check it too */
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important;
       transition-duration:0.001ms !important; scroll-behavior:auto !important; }
  }

  /* Visible keyboard focus, never removed, never trapped */
  :focus-visible{ outline:2px solid var(--gold); outline-offset:3px; border-radius:4px; }

  /* ============================================================
     AMBIENT BACKGROUND — drifting gradient + stars + particles
  ============================================================ */
  #ambient{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 15%, rgba(183,155,234,0.20), transparent 60%),
      radial-gradient(ellipse 70% 50% at 85% 80%, rgba(255,111,156,0.18), transparent 60%),
      linear-gradient(180deg, var(--ink-deep) 0%, var(--ink-mid) 45%, var(--plum) 100%);
    background-size:200% 200%;
    animation:driftGradient 22s ease-in-out infinite;
  }
  @keyframes driftGradient{
    0%,100%{ background-position:0% 0%; }
    50%{ background-position:60% 40%; }
  }
  #stars, #particles{
    position:fixed; inset:0; z-index:1;
    width:100%; height:100%;
    pointer-events:none;
  }

  /* ============================================================
     MAIN EXPERIENCE — the letter opens the page now
  ============================================================ */
  #experience{
    position:relative; z-index:2;
    opacity:0;
    transition:opacity 1.6s var(--ease-soft);
  }
  #experience.revealed{ opacity:1; }

  .wrap{ max-width:760px; margin:0 auto; padding:0 24px; }

  #letter-section{
    min-height:100svh;
    display:flex; align-items:center; justify-content:center;
    padding:min(12vh,110px) 0 90px;
  }

  .glass-card{
    position:relative;
    width:100%;
    padding:clamp(28px, 6vw, 64px);
    border-radius:28px;
    background:rgba(251,243,233,0.055);
    border:1px solid rgba(251,243,233,0.14);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 30px 90px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    opacity:0;
    transform:translateY(30px) scale(.98);
  }
  .glass-card.in-view{ animation:cardRise 1.2s var(--ease-out) forwards; }
  @keyframes cardRise{ to{ opacity:1; transform:translateY(0) scale(1); } }

  .eyebrow{
    font-family:var(--body);
    font-size:.72rem; letter-spacing:.32em; text-transform:uppercase;
    color:var(--rose-soft); text-align:center;
    margin:0 0 18px; opacity:.85;
  }

  h1.subtitle{
    font-family:var(--display);
    font-style:italic; font-weight:500;
    font-size:clamp(1.6rem, 5vw, 2.4rem);
    text-align:center; line-height:1.2;
    background:linear-gradient(100deg, var(--paper) 20%, var(--rose-soft) 55%, var(--lavender) 85%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:0 0 40px;
  }

  .divider{
    width:56px; height:1px; margin:0 auto 44px;
    background:linear-gradient(90deg, transparent, var(--rose), transparent);
  }

  #letter-text{
    font-family:var(--display);
    font-size:clamp(1.12rem, 2.6vw, 1.35rem);
    line-height:1.85;
    color:var(--paper);
    white-space:pre-wrap;
    min-height:340px;
    margin:0;
  }
  #letter-text .cursor{
    display:inline-block; width:2px; height:1.1em;
    background:var(--rose-soft); margin-left:2px;
    vertical-align:text-bottom;
    animation:blink 1s step-end infinite;
  }
  #letter-text .cursor.done{ display:none; }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ---- Surprise button ---- */
  #surprise-wrap{
    display:flex; justify-content:center;
    margin-top:52px;
    opacity:0; transform:translateY(16px);
    transition:opacity 1s var(--ease-out), transform 1s var(--ease-out);
    pointer-events:none;
  }
  #surprise-wrap.ready{ opacity:1; transform:translateY(0); pointer-events:auto; }

  #surprise-btn{
    padding:18px 40px;
    font-size:1rem; letter-spacing:.04em; font-weight:500;
    color:var(--ink-deep);
    background:linear-gradient(120deg, var(--gold), var(--rose-soft));
    border:none; border-radius:999px;
    box-shadow:0 12px 40px rgba(255,111,156,0.35);
    transition:transform .35s var(--ease-out), box-shadow .35s var(--ease-out);
  }
  #surprise-btn:hover{
    transform:translateY(-3px) scale(1.03);
    box-shadow:0 18px 55px rgba(255,111,156,0.5);
  }
  #surprise-btn:active{ transform:translateY(-1px) scale(0.99); }

  #footnote{
    text-align:center; font-size:.72rem; letter-spacing:.06em;
    color:rgba(251,243,233,0.35);
    padding:40px 0 60px;
  }

  /* ============================================================
     FINALE — heart storm, final words, then the invitation to watch
  ============================================================ */
  #finale{
    position:fixed; inset:0; z-index:80;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, var(--plum) 0%, var(--ink-deep) 75%);
    opacity:0; visibility:hidden;
    transition:opacity 1.8s var(--ease-soft), visibility 1.8s;
    overflow-y:auto;
  }
  #finale.active{ opacity:1; visibility:visible; }

  #finale-hearts{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .burst-heart{
    position:absolute; bottom:-5%;
    font-size:1.4rem; opacity:0;
    animation:burstUp linear forwards;
    filter:drop-shadow(0 0 6px rgba(255,111,156,0.65));
  }
  @keyframes burstUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:1; }
    100%{ transform:translateY(-115vh) translateX(var(--drift,0px)) rotate(var(--spin,180deg)); opacity:0; }
  }

  #finale-content{
    position:relative; z-index:2;
    text-align:center; padding:60px 24px;
    opacity:0; transform:scale(.92);
    transition:opacity 1.4s var(--ease-out) .5s, transform 1.4s var(--ease-out) .5s;
  }
  #finale.active #finale-content{ opacity:1; transform:scale(1); }

  #finale-content .heart-glow{
    font-size:clamp(2.4rem, 8vw, 3.6rem);
    display:block; margin-bottom:18px;
    animation:heartbeat 1.8s ease-in-out infinite;
    filter:drop-shadow(0 0 20px rgba(255,111,156,0.7));
  }
  @keyframes heartbeat{
    0%,100%{ transform:scale(1); }
    15%{ transform:scale(1.15); }
    30%{ transform:scale(1); }
    45%{ transform:scale(1.1); }
  }

  #finale-content h2{
    font-family:var(--display); font-weight:600;
    font-size:clamp(2rem, 7vw, 3.4rem);
    background:linear-gradient(100deg, var(--paper), var(--rose-soft), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:0 0 22px;
  }
  #finale-content > p{
    font-family:var(--display); font-style:italic;
    font-size:clamp(1.1rem, 3vw, 1.5rem);
    color:var(--paper-dim); line-height:1.6;
    margin:0;
  }

  /* ---- The invitation to watch the video ---- */
  #watch-invite{
    margin-top:56px;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    opacity:0; transform:translateY(20px);
    transition:opacity 1.2s var(--ease-out), transform 1.2s var(--ease-out);
    pointer-events:none;
  }
  #watch-invite.ready{ opacity:1; transform:translateY(0); pointer-events:auto; }

  #watch-invite .invite-rule{
    width:44px; height:1px; margin-bottom:6px;
    background:linear-gradient(90deg, transparent, var(--rose-soft), transparent);
  }
  #watch-invite .invite-line{
    font-family:var(--display); font-style:italic;
    font-size:clamp(1.05rem, 3vw, 1.3rem);
    color:var(--paper-dim);
    margin:0; max-width:30ch; line-height:1.55;
  }
  #watch-btn{
    display:flex; align-items:center; gap:12px;
    padding:15px 28px 15px 18px;
    border-radius:999px; border:1px solid rgba(251,243,233,0.28);
    background:rgba(251,243,233,0.07);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    color:var(--paper);
    font-size:.86rem; letter-spacing:.12em; text-transform:uppercase;
    box-shadow:0 0 34px rgba(255,111,156,0.28);
    animation:pulseGlow 2.8s ease-in-out infinite;
    transition:transform .3s var(--ease-out), background .3s;
  }
  #watch-btn:hover{ transform:scale(1.04); background:rgba(251,243,233,0.14); }
  #watch-btn .play-dot{
    width:36px; height:36px; border-radius:50%; flex:0 0 36px;
    background:linear-gradient(120deg, var(--gold), var(--rose-soft));
    display:flex; align-items:center; justify-content:center;
  }
  #watch-btn .play-dot svg{ width:14px; height:14px; margin-left:2px; fill:var(--ink-deep); }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 0 26px rgba(255,111,156,0.26); }
    50%{ box-shadow:0 0 50px rgba(255,111,156,0.5); }
  }

  /* ============================================================
     VIDEO STAGE — the final act, above everything
  ============================================================ */
  #video-stage{
    position:fixed; inset:0; z-index:95;
    display:flex; align-items:center; justify-content:center;
    background:#000;
    opacity:0; visibility:hidden;
    transition:opacity 1.2s var(--ease-soft), visibility 1.2s;
  }
  #video-stage.active{ opacity:1; visibility:visible; }

  #intro-video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover; /* fills the screen on phones, where the video is portrait-native */
  }
  /* A portrait video on a landscape screen would be cropped to a sliver,
     so show it whole and let a soft plum wash frame it instead. */
  @media (orientation: landscape) and (min-width:700px){
    #intro-video{ object-fit:contain; }
    #video-stage{ background:radial-gradient(ellipse at 50% 50%, #241338 0%, #060410 80%); }
  }

  /* Embed fallback, used only if VIDEO_URL is a Google Drive share link */
  #intro-embed{
    position:absolute; inset:0; width:100%; height:100%;
    border:none; display:none;
  }
  #intro-embed.active{ display:block; }

  #video-msg{
    position:relative; z-index:2;
    display:none; text-align:center; padding:0 30px;
    font-family:var(--display); font-style:italic;
    font-size:clamp(1.1rem, 3vw, 1.4rem);
    color:var(--paper-dim); line-height:1.6;
  }
  #video-msg.active{ display:block; }

  #close-video{
    position:absolute; top:22px; right:22px; z-index:4;
    background:rgba(0,0,0,0.35); border:1px solid rgba(251,243,233,0.35);
    color:var(--paper-dim);
    font-size:.75rem; letter-spacing:.1em; text-transform:uppercase;
    padding:9px 18px; border-radius:999px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:border-color .3s, color .3s;
  }
  #close-video:hover{ border-color:var(--paper); color:var(--paper); }

  /* ============================================================
     MUSIC PLAYER
  ============================================================ */
  #music-player{
    position:fixed; bottom:22px; right:22px; z-index:99;
    display:none; align-items:center; gap:10px;
    padding:10px 16px 10px 12px;
    border-radius:999px;
    background:rgba(23,15,43,0.55);
    border:1px solid rgba(251,243,233,0.18);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  }
  #music-player.enabled{ display:flex; }
  #music-toggle{
    width:34px; height:34px; border-radius:50%; border:none;
    background:linear-gradient(120deg, var(--rose), var(--lavender));
    display:flex; align-items:center; justify-content:center;
  }
  #music-toggle svg{ width:14px; height:14px; fill:var(--ink-deep); }
  #music-player span{
    font-size:.72rem; letter-spacing:.06em;
    color:var(--paper-dim); text-transform:uppercase; padding-right:2px;
  }

  /* ============================================================
     RESPONSIVE
  ============================================================ */
  @media (max-width:480px){
    .glass-card{ border-radius:20px; padding:26px 20px 34px; }
    #letter-text{ min-height:420px; }
    #surprise-btn{ padding:16px 30px; font-size:.92rem; }
    #watch-btn{ padding:13px 22px 13px 14px; font-size:.78rem; }
    #finale-content{ padding:48px 20px; }
  }
</style>
</head>
<body>

  <!-- ============================================================
       AMBIENT BACKGROUND (persistent behind every scene)
  ============================================================ -->
  <div id="ambient" aria-hidden="true"></div>
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="particles" aria-hidden="true"></canvas>

  <!-- ============================================================
       ACT ONE — the letter
  ============================================================ -->
  <main id="experience">
    <section id="letter-section" class="wrap">
      <article class="glass-card" id="letter-card">
        <p class="eyebrow">Girlfriend's Day</p>
        <h1 class="subtitle">To My Beautiful Nahjela</h1>
        <div class="divider"></div>

        <p id="letter-text"><span class="cursor"></span></p>

        <div id="surprise-wrap">
          <button id="surprise-btn">💖 One Last Surprise</button>
        </div>
      </article>
    </section>

    <p id="footnote">Made with love, for Nahjela.</p>
  </main>

  <!-- ============================================================
       ACT TWO — the finale, ending with the invitation to watch
  ============================================================ -->
  <section id="finale" aria-live="polite" aria-label="Final message">
    <div id="finale-hearts" aria-hidden="true"></div>

    <div id="finale-content">
      <span class="heart-glow" aria-hidden="true">❤️</span>
      <h2>I Love You, Nahjela ❤️</h2>
      <p>Forever Yours,<br>Simon</p>

      <div id="watch-invite">
        <span class="invite-rule" aria-hidden="true"></span>
        <p class="invite-line">One more thing, my love — I made you something. Press play.</p>
        <button id="watch-btn">
          <span class="play-dot" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </span>
          Watch our video
        </button>
      </div>
    </div>
  </section>

  <!-- ============================================================
       ACT THREE — the video
  ============================================================ -->
  <section id="video-stage" aria-label="Video">
    <video id="intro-video" playsinline preload="metadata"></video>
    <iframe id="intro-embed" title="Our video" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    <p id="video-msg"></p>
    <button id="close-video" aria-label="Close video">Close</button>
  </section>

  <!-- ============================================================
       MUSIC PLAYER (hidden unless MUSIC_URL is set)
  ============================================================ -->
  <div id="music-player">
    <button id="music-toggle" aria-label="Play background music">
      <svg id="music-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <span>Music</span>
  </div>

  <script>
  /* ================================================================
     CONFIG — edit these two lines only.
     VIDEO_URL: keep "love.mp4" next to index.html in your repo.
                A Google Drive share link also works (it loads in an
                iframe instead), but a direct file plays far better.
     MUSIC_URL: leave empty to hide the music player entirely.
  ================================================================ */
  const VIDEO_URL = "love.mp4";
  const MUSIC_URL = "";

  /* Honour the visitor's motion preference throughout */
  const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================================================================
     MODULE: Ambient Background (stars + drifting hearts/sparkles)
     Two lightweight canvases sharing one animation frame loop.
  ================================================================ */
  const AmbientModule = (() => {
    const starCanvas = document.getElementById('stars');
    const partCanvas = document.getElementById('particles');
    const sctx = starCanvas.getContext('2d');
    const pctx = partCanvas.getContext('2d');
    let stars = [], particles = [];

    function resize(){
      [starCanvas, partCanvas].forEach(c => {
        c.width = window.innerWidth;
        c.height = window.innerHeight;
      });
    }

    function buildStars(){
      const count = REDUCED_MOTION ? 40 : 110;
      stars = Array.from({length: count}, () => ({
        x: Math.random() * starCanvas.width,
        y: Math.random() * starCanvas.height,
        r: Math.random() * 1.3 + 0.2,
        phase: Math.random() * Math.PI * 2,
        speed: 0.01 + Math.random() * 0.02
      }));
    }

    function buildParticles(){
      const count = REDUCED_MOTION ? 10 : 26;
      particles = Array.from({length: count}, () => ({
        x: Math.random() * partCanvas.width,
        y: Math.random() * partCanvas.height,
        size: 6 + Math.random() * 10,
        speedY: 0.15 + Math.random() * 0.35,
        driftX: (Math.random() - 0.5) * 0.4,
        isHeart: Math.random() > 0.7,
        opacity: 0.15 + Math.random() * 0.35
      }));
    }

    function drawHeart(ctx, x, y, size, opacity){
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.translate(x, y);
      ctx.fillStyle = '#ff6f9c';
      ctx.shadowColor = '#ff6f9c';
      ctx.shadowBlur = 8;
      const s = size / 16;
      ctx.beginPath();
      ctx.moveTo(0, 4*s);
      ctx.bezierCurveTo(0, 2*s, -4*s, -4*s, -8*s, -2*s);
      ctx.bezierCurveTo(-14*s, 2*s, -6*s, 10*s, 0, 14*s);
      ctx.bezierCurveTo(6*s, 10*s, 14*s, 2*s, 8*s, -2*s);
      ctx.bezierCurveTo(4*s, -4*s, 0, 2*s, 0, 4*s);
      ctx.fill();
      ctx.restore();
    }

    function drawSpark(ctx, x, y, size, opacity){
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.fillStyle = '#f2c675';
      ctx.shadowColor = '#f2c675';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(x, y, size/6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function tick(t){
      sctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
      stars.forEach(s => {
        const tw = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
        sctx.save();
        sctx.globalAlpha = 0.25 + tw * 0.6;
        sctx.fillStyle = '#fbf3e9';
        sctx.beginPath();
        sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        sctx.fill();
        sctx.restore();
      });

      pctx.clearRect(0, 0, partCanvas.width, partCanvas.height);
      particles.forEach(p => {
        if (!REDUCED_MOTION){
          p.y -= p.speedY;
          p.x += p.driftX;
          if (p.y < -20){ p.y = partCanvas.height + 20; p.x = Math.random() * partCanvas.width; }
        }
        if (p.isHeart) drawHeart(pctx, p.x, p.y, p.size, p.opacity);
        else drawSpark(pctx, p.x, p.y, p.size, p.opacity);
      });

      requestAnimationFrame(tick);
    }

    function init(){
      resize(); buildStars(); buildParticles();
      window.addEventListener('resize', () => { resize(); buildStars(); buildParticles(); });
      requestAnimationFrame(tick);
    }

    return { init };
  })();

  /* ================================================================
     MODULE: Love Letter (typewriter)
  ================================================================ */
  const LetterModule = (() => {
    const textEl = document.getElementById('letter-text');
    const card   = document.getElementById('letter-card');
    const surpriseWrap = document.getElementById('surprise-wrap');

    const LETTER = `Nahjela,

There's a version of me from before you that I can barely recognize — restless, moving fast, chasing everything but rarely still. You didn't slow me down. You gave me a reason to actually look up.

I love how easily you laugh at things only we find funny. I love that you believe in the things I build before I've finished explaining them. I love the quiet moments too — waiting for your reply, hearing your voice at the end of a long day, the way ordinary time turns into something worth remembering simply because you're in it.

Today isn't really about a date on a calendar. It's about a decision I keep making, over and over, without ever thinking twice: you. Every version of my future I imagine has you standing somewhere in it.

So happy Girlfriend's Day, Nahjela. Thank you for choosing me, for staying, for being exactly who you are.

This is just the beginning.`;

    let started = false;

    function typewrite(){
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      let i = 0;

      if (REDUCED_MOTION){
        textEl.textContent = LETTER;
        surpriseWrap.classList.add('ready');
        return;
      }

      function step(){
        if (i <= LETTER.length){
          textEl.textContent = LETTER.slice(0, i);
          textEl.appendChild(cursor);
          i++;
          // Slightly irregular pacing reads more human than a fixed interval
          window.setTimeout(step, 14 + Math.random() * 22);
        } else {
          cursor.classList.add('done');
          surpriseWrap.classList.add('ready');
        }
      }
      step();
    }

    function start(){
      if (started) return;
      started = true;
      document.getElementById('experience').classList.add('revealed');
      card.classList.add('in-view');
      window.setTimeout(typewrite, 900);
    }

    return { start };
  })();

  /* ================================================================
     MODULE: Finale — heart storm, final words, then the invitation
  ================================================================ */
  const FinaleModule = (() => {
    const finale = document.getElementById('finale');
    const heartsLayer = document.getElementById('finale-hearts');
    const btn = document.getElementById('surprise-btn');
    const invite = document.getElementById('watch-invite');
    const glyphs = ['❤️','💖','💕','💗','✨'];

    function spawnHearts(){
      const count = REDUCED_MOTION ? 30 : 220;
      const frag = document.createDocumentFragment();
      for (let i = 0; i < count; i++){
        const h = document.createElement('span');
        h.className = 'burst-heart';
        h.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
        h.style.left = (Math.random() * 100) + 'vw';
        h.style.fontSize = (0.9 + Math.random() * 1.8) + 'rem';
        h.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
        h.style.setProperty('--spin', (Math.random() * 360 - 180) + 'deg');
        h.style.animationDuration = (4 + Math.random() * 5) + 's';
        h.style.animationDelay = (Math.random() * 3) + 's';
        frag.appendChild(h);
      }
      heartsLayer.appendChild(frag);
    }

    function open(){
      finale.classList.add('active');
      spawnHearts();
      // Let the final words land on their own before inviting her onward
      window.setTimeout(() => invite.classList.add('ready'), REDUCED_MOTION ? 600 : 4200);
      // Move focus into the finale; nothing here traps it
      finale.setAttribute('tabindex', '-1');
      finale.focus({ preventScroll: true });
    }

    function init(){ btn.addEventListener('click', open); }

    return { init };
  })();

  /* ================================================================
     MODULE: Video Stage — the closing act.
     Playback begins from her tap, which means it can start with
     sound on. Every failure path still lets her back out cleanly.
  ================================================================ */
  const VideoModule = (() => {
    const stage    = document.getElementById('video-stage');
    const video    = document.getElementById('intro-video');
    const embed    = document.getElementById('intro-embed');
    const msg      = document.getElementById('video-msg');
    const closeBtn = document.getElementById('close-video');
    const watchBtn = document.getElementById('watch-btn');
    let loaded = false;

    function isDirectVideoFile(url){
      return /\.(mp4|webm|ogg)(\?.*)?$/i.test(url);
    }

    /* Recognise a Google Drive link and convert it to its embeddable
       /preview form, the only shape Drive video can be shown in. */
    function toDrivePreview(url){
      const match = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
      return match ? 'https://drive.google.com/file/d/' + match[1] + '/preview' : null;
    }

    function showMessage(text){
      video.style.display = 'none';
      msg.textContent = text;
      msg.classList.add('active');
    }

    function close(){
      stage.classList.remove('active');
      try { video.pause(); } catch(e) {}
      embed.src = '';
      document.getElementById('watch-btn').focus({ preventScroll: true });
    }

    function open(){
      stage.classList.add('active');
      closeBtn.focus({ preventScroll: true });

      if (loaded){ // already opened once — just replay from the top
        try { video.currentTime = 0; video.play(); } catch(e) {}
        return;
      }
      loaded = true;

      if (!VIDEO_URL){
        showMessage('The video is on its way. I love you regardless. ❤️');
        return;
      }

      const drivePreview = toDrivePreview(VIDEO_URL);
      if (drivePreview){
        video.style.display = 'none';
        embed.src = drivePreview;
        embed.classList.add('active');
        return;
      }

      if (!isDirectVideoFile(VIDEO_URL)){
        showMessage('The video is on its way. I love you regardless. ❤️');
        return;
      }

      video.src = VIDEO_URL;

      // Safety net: never leave her staring at a black screen
      const stuckTimer = window.setTimeout(() => {
        showMessage('The video is taking its time. Everything I wanted to say is already above. ❤️');
      }, 8000);

      video.addEventListener('canplay', () => window.clearTimeout(stuckTimer), { once:true });
      video.addEventListener('error', () => {
        window.clearTimeout(stuckTimer);
        showMessage('The video would not load here, but every word above still stands. ❤️');
      }, { once:true });

      // Her tap counts as the interaction browsers require, so this
      // can start unmuted. If a browser still objects, fall back to
      // muted playback rather than showing nothing at all.
      video.muted = false;
      video.play().catch(() => {
        video.muted = true;
        video.play().catch(() => {
          showMessage('Tap the screen to start the video. ❤️');
        });
      });

      video.addEventListener('ended', () => {
        window.setTimeout(close, 1200); // a beat, then drift back to the hearts
      });
    }

    function init(){
      watchBtn.addEventListener('click', open);
      closeBtn.addEventListener('click', close);
      // Escape closes the video, as any viewer would expect
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && stage.classList.contains('active')) close();
      });
    }

    return { init };
  })();

  /* ================================================================
     MODULE: Music Player (only appears if MUSIC_URL is supplied)
  ================================================================ */
  const MusicModule = (() => {
    const player = document.getElementById('music-player');
    const toggle = document.getElementById('music-toggle');
    const icon   = document.getElementById('music-icon');
    let audio = null, playing = false;

    const PATH_PLAY  = 'M8 5v14l11-7z';
    const PATH_PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';

    function init(){
      if (!MUSIC_URL) return; // stays hidden entirely
      audio = new Audio(MUSIC_URL);
      audio.loop = true;
      audio.volume = 0.55;
      player.classList.add('enabled');

      toggle.addEventListener('click', () => {
        if (playing){
          audio.pause();
          icon.querySelector('path').setAttribute('d', PATH_PLAY);
          toggle.setAttribute('aria-label', 'Play background music');
        } else {
          audio.play().catch(() => {});
          icon.querySelector('path').setAttribute('d', PATH_PAUSE);
          toggle.setAttribute('aria-label', 'Pause background music');
        }
        playing = !playing;
      });

      // Music should never fight the video for her attention
      document.getElementById('watch-btn').addEventListener('click', () => {
        if (playing) toggle.click();
      });
    }

    return { init };
  })();

  /* ================================================================
     BOOT
  ================================================================ */
  document.addEventListener('DOMContentLoaded', () => {
    AmbientModule.init();
    FinaleModule.init();
    VideoModule.init();
    MusicModule.init();
    LetterModule.start();
  });
  </script>
</body>
</html>
