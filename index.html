<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Girlfriend's Day ❤️</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:#000;
overflow:hidden;
}
#intro{
position:fixed;
inset:0;
}
iframe{
width:100%;
height:100%;
border:none;
}
.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.35);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
pointer-events:none;
text-align:center;
z-index:2;
}
.overlay h1{
font-size:3rem;
text-shadow:0 2px 12px rgba(0,0,0,.6);
}
.overlay p{
font-size:1.3rem;
margin-top:.5rem;
text-shadow:0 2px 8px rgba(0,0,0,.6);
}

/* Floating hearts */
.hearts{
position:absolute;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:3;
}
.heart{
position:absolute;
bottom:-10%;
font-size:1.5rem;
color:#ff4d6d;
opacity:0;
animation:floatUp linear infinite;
text-shadow:0 0 8px rgba(255,77,109,.7);
}
@keyframes floatUp{
0%{
transform:translateY(0) translateX(0) rotate(0deg) scale(.8);
opacity:0;
}
10%{
opacity:1;
}
50%{
transform:translateY(-55vh) translateX(20px) rotate(15deg) scale(1);
}
90%{
opacity:.9;
}
100%{
transform:translateY(-110vh) translateX(-15px) rotate(-10deg) scale(.9);
opacity:0;
}
}
</style>
</head>
<body>
<section id="intro">
<iframe
src="https://drive.google.com/file/d/1w0jbZQfBwrGe1-LIiaUF-9JjWRiIRx-k/preview"
allow="autoplay">
</iframe>
<div class="overlay">
<h1>Happy Girlfriend's Day ❤️</h1>
<p>For My Beautiful Nahjela</p>
</div>
<div class="hearts" id="hearts"></div>
</section>

<script>
const container = document.getElementById('hearts');
const symbols = ['❤️','💕','💖','💗'];
const heartCount = 28;

for (let i = 0; i < heartCount; i++) {
const heart = document.createElement('span');
heart.className = 'heart';
heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];

const left = Math.random() * 100;
const size = 1 + Math.random() * 1.6;
const duration = 6 + Math.random() * 7;
const delay = Math.random() * 10;

heart.style.left = left + 'vw';
heart.style.fontSize = size + 'rem';
heart.style.animationDuration = duration + 's';
heart.style.animationDelay = delay + 's';

container.appendChild(heart);
}
</script>
</body>
</html>
